name: Stage stability diagnostics

on:
  push:
    branches: [agent/stabilize-debug-health]

permissions:
  contents: write

jobs:
  validate-and-stage:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Apply instrumentation patch
        run: node scripts/apply-stability-debug.mjs
      - run: npm ci
      - name: TypeScript
        run: npm run lint
      - name: Unit and regression tests
        run: npm test
      - name: Production build
        run: npm run build
      - name: Critical production artifact smoke
        run: npm run test:critical
      - name: Commit validated product changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/App.tsx src/components/BookCover.tsx package.json
          if git diff --cached --quiet; then
            echo "Validated product patch already committed."
          else
            git commit -m "feat: add mobile diagnostics and critical health gate"
            git push
          fi
