name: Stage mobile cover readability

on:
  push:
    branches: [agent/mobile-cover-readability]

permissions:
  contents: write

jobs:
  validate-and-stage:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Apply and validate with report
        shell: bash
        run: |
          set +e
          LOG=/tmp/mobile-cover-stage.log
          : > "$LOG"
          STATUS=PASS

          run_step() {
            NAME="$1"
            shift
            echo "===== $NAME =====" >> "$LOG"
            "$@" >> "$LOG" 2>&1
            RC=$?
            echo "exit=$RC" >> "$LOG"
            echo >> "$LOG"
            if [ "$RC" -ne 0 ]; then
              STATUS=FAIL
              return "$RC"
            fi
            return 0
          }

          run_step PATCH node scripts/apply-mobile-cover-readability.mjs
          if [ "$STATUS" = PASS ]; then run_step NPM_CI npm ci; fi
          if [ "$STATUS" = PASS ]; then run_step TYPESCRIPT npm run lint; fi
          if [ "$STATUS" = PASS ]; then run_step TESTS npm test; fi
          if [ "$STATUS" = PASS ]; then run_step BUILD npm run build; fi
          if [ "$STATUS" = PASS ]; then run_step CRITICAL_SMOKE npm run test:critical; fi

          {
            echo "STATUS=$STATUS"
            echo "HEAD=$(git rev-parse HEAD)"
            echo
            tail -n 240 "$LOG"
          } > staging-result.txt

          cat staging-result.txt
          exit 0

      - name: Commit report and validated product changes
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add staging-result.txt
          if grep -q '^STATUS=PASS$' staging-result.txt; then
            git add src/components/BookCover.tsx src/hooks/useLibrary.ts
          fi
          git commit -m "chore: mobile cover staging result [skip ci]"
          git push

      - name: Require green result
        run: grep -q '^STATUS=PASS$' staging-result.txt
