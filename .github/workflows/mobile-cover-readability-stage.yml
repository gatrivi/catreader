name: Stage mobile cover readability

on:
  push:
    branches: [agent/mobile-cover-readability]

permissions:
  contents: write

jobs:
  validate-and-stage:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Apply patch
        run: node scripts/apply-mobile-cover-readability.mjs
      - run: npm ci
      - name: TypeScript
        run: npm run lint
      - name: Tests
        run: npm test
      - name: Production build
        run: npm run build
      - name: Critical smoke
        run: npm run test:critical
      - name: Commit validated product changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components/BookCover.tsx src/hooks/useLibrary.ts
          if git diff --cached --quiet; then
            echo "Product changes already committed."
          else
            git commit -m "fix: make mobile library covers readable"
            git push
          fi
