name: Import Catholic knighthood books

on:
  pull_request:
    branches:
      - main
    paths:
      - scripts/import-knighthood-books.py
      - .github/workflows/import-knighthood-books.yml

permissions:
  contents: write

jobs:
  import-books:
    if: github.head_ref == 'agent/add-catholic-knighthood-books'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/add-catholic-knighthood-books

      - name: Install PDF text tools
        run: sudo apt-get update && sudo apt-get install -y poppler-utils

      - name: Import public-domain editions
        run: python3 scripts/import-knighthood-books.py

      - name: Regenerate CatReader library
        run: node scripts/generate-library.js

      - name: Commit imported books
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/books public/books.json
          if git diff --cached --quiet; then
            echo "No import changes"
            exit 0
          fi
          git commit -m "add public-domain Catholic knighthood books"
          git push origin HEAD:agent/add-catholic-knighthood-books
