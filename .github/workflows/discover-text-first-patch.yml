name: Discover text first

on:
  push:
    branches: [agent/discover-text-first]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Apply patch
        run: python scripts/apply-discover-text-first.py
      - name: Install
        run: npm ci
      - name: Validate
        run: |
          npm run lint
          npm test
          npm run build
      - name: Commit result
        run: |
          rm -f .text-first-trigger
          rm -f scripts/apply-discover-text-first.py
          rm -f .github/workflows/discover-text-first-patch.yml
          git config user.name "catreader-agent"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "perf: open Discover PDFs text-first [text-first-applied]"
          git push
