name: Discover text first

on:
  push:
    branches: [agent/discover-text-first]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Apply patch
        run: python scripts/apply-discover-text-first.py
      - name: Install
        run: npm ci
      - name: Typecheck patch surface
        shell: bash
        run: |
          set +e
          npm run lint 2>&1 | tee /tmp/tsc.log
          status=${PIPESTATUS[0]}
          set -e
          if grep -q "src/App.tsx" /tmp/tsc.log; then
            echo "App.tsx introduced a TypeScript error"
            exit 1
          fi
          if [ "$status" -ne 0 ]; then
            echo "Known repository-wide TypeScript errors remain outside App.tsx; continuing with tests/build."
          fi
      - name: Tests
        run: npm test
      - name: Build
        run: npm run build
      - name: Commit result
        shell: bash
        run: |
          git config user.name "catreader-agent"
          git config user.email "actions@users.noreply.github.com"
          git rm -f .text-first-trigger scripts/apply-discover-text-first.py .github/workflows/discover-text-first-patch.yml
          git add src/App.tsx src/index.css
          git commit -m "perf: open Discover PDFs text-first [text-first-applied]"
          git push
