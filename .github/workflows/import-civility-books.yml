name: Import Catholic civility books

on:
  pull_request:
    branches: [main]
    paths:
      - scripts/import-civility-books.py
      - .github/workflows/import-civility-books.yml

permissions:
  contents: write

jobs:
  import-books:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
      - name: Import public-domain civility books
        run: python3 scripts/import-civility-books.py
      - name: Regenerate library
        run: node scripts/generate-library.js
      - name: Commit imported books
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/books public/books.json
          if git diff --cached --quiet; then
            echo "No import changes"
            exit 0
          fi
          git commit -m "add public-domain Catholic civility books"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
