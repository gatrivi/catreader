name: Critical hardening

on:
  push:
    branches:
      - agent/critical-hardening

permissions:
  contents: write

jobs:
  validate-and-commit:
    if: ${{ !contains(github.event.head_commit.message, '[validated]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Apply hardening patch
        run: node scripts/critical-hardening.mjs
      - name: Install
        run: npm ci
      - name: Typecheck
        run: npm run lint
      - name: Tests
        run: npm test
      - name: Production compile
        run: npx vite build
      - name: Commit validated changes
        run: |
          rm -f scripts/critical-hardening.mjs .github/workflows/critical-hardening.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: harden critical reader path [validated]"
          git push origin HEAD:agent/critical-hardening
