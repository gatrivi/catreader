<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256">
  <!-- Shared paper fiber grain  static tile (plan phase 4). feTurbulence stand-in until photo tiles land. -->
  <filter id="g" x="0" y="0" width="100%" height="100%">
    <feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="4" stitchTiles="stitch" result="n"/>
    <feColorMatrix type="matrix" values="0 0 0 0 0.55
                                         0 0 0 0 0.45
                                         0 0 0 0 0.32
                                         0 0 0 0.35 0" in="n"/>
  </filter>
  <rect width="256" height="256" filter="url(#g)"/>
</svg>
